<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking FIP</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #0066cc, #004080);
            color: white;
            margin: 0;
            padding: 0;
        }

        h1, h2 {
            margin-bottom: 10px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            color: black;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: all 0.3s ease;
        }

        .player img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid #004080;
            transition: transform 0.3s;
        }

        .player img:hover {
            transform: scale(1);
        }

        .arrows {
            display: flex;
            justify-content: space-between;
            margin: 20px auto;
        }

        .arrow {
            font-size: 24px;
            background: #004080;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .arrow:hover {
            background: #002a4d;
            transform: scale(1.05);
        }

        .section {
            background: white;
            color: black;
            border-radius: 20px;
            padding: 25px;
            margin: 30px auto;
            max-width: 800px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        #tournament-list, #paddle-recommendation {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .tournament, .paddle {
            width: 250px;
            background: #f2f2f2;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .tournament:hover, .paddle:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tournament img, .paddle img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .tournament a, .paddle a {
            color: #004080;
            font-weight: bold;
            text-decoration: none;
        }

        .tournament a:hover, .paddle a:hover {
            text-decoration: underline;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ranking FIP</h1>
        <div id="player-info" class="player">
            <img id="player-img" src="" alt="Jugador">
            <h2 id="name">Nombre</h2>
            <p id="rank">Posición: </p>
            <p id="country"></p>
            <p id="points">Puntos: </p>
        </div>
        <div class="arrows">
            <div class="arrow" onclick="prevPlayer()">⬅</div>
            <div class="arrow" onclick="nextPlayer()">➡</div>
        </div>
    </div>

    <div class="section">
        <h2>Torneos</h2>
        <p>Consulta los próximos torneos de pádel y compra tus entradas:</p>
        <div id="tournament-list"></div>
    </div>

    <div class="section">
        <h2>Recomendador de Palas</h2>
        <p>Elige tu estilo de juego para recibir una recomendación:</p>
        <select id="style-select" onchange="recommendPaddle()">
            <option value="control">Control</option>
            <option value="potencia">Potencia</option>
            <option value="equilibrado">Equilibrado</option>
        </select>
        <div id="paddle-recommendation"></div>
    </div>

    <script>
        const players = [
            { rank: 1, name: "Agustín Tapia", country: "Argentina", flag: "🇦🇷", points: 19340, img: "https://www.padelfip.com/wp-content/uploads/2023/02/04-TAPIA-2-662x1024.png" },
            { rank: 2, name: "Juan Lebrón", country: "España", flag: "🇪🇸", points: 18500, img: "https://www.padelfip.com/wp-content/uploads/2023/02/Lebron-3-662x1024.png" },
            { rank: 3, name: "Alejandro Galán", country: "España", flag: "🇪🇸", points: 18200, img: "https://www.padelfip.com/wp-content/uploads/2023/02/galan-2-662x1024.png" },
            { rank: 4, name: "Paquito Navarro", country: "España", flag: "🇪🇸", points: 17950, img: "https://www.padelfip.com/wp-content/uploads/2023/02/Francisco-Navarro_2-1.png" },
            { rank: 5, name: "Franco Stupaczuk", country: "Argentina", flag: "🇦🇷", points: 17500, img: "https://www.padelfip.com/wp-content/uploads/2023/02/Stupaczuk-1-662x1024.png" },
            { rank: 6, name: "Martín Di Nenno", country: "Argentina", flag: "🇦🇷", points: 17250, img: "https://www.padelfip.com/wp-content/uploads/2023/02/05-DI-NENNO-662x1024.png" },
            { rank: 7, name: "Arturo Coello", country: "España", flag: "🇪🇸", points: 17000, img: "https://www.padelfip.com/wp-content/uploads/2023/02/01-COELLO-662x1024.png" },
            { rank: 8, name: "Federico Chingotto", country: "Argentina", flag: "🇦🇷", points: 16500, img: "https://www.padelfip.com/wp-content/uploads/2023/02/08-CHINGOTTO-662x1024.png" },
            { rank: 9, name: "Sanyo Gutiérrez", country: "Argentina", flag: "🇦🇷", points: 16000, img: "https://www.padelfip.com/wp-content/uploads/2023/02/Gutierrez-2-662x1024.png" },
            { rank: 10, name: "Momo González", country: "España", flag: "🇪🇸", points: 15800, img: "https://www.padelfip.com/wp-content/uploads/2023/02/Gonzalez-2-662x1024.png" }
        ];

        let currentIndex = 0;

        function updatePlayer() {
            const player = players[currentIndex];
            document.getElementById("name").innerText = player.name;
            document.getElementById("rank").innerText = "Posición: " + player.rank;
            document.getElementById("country").innerText = player.flag + " " + player.country;
            document.getElementById("points").innerText = "Puntos: " + player.points;
            document.getElementById("player-img").src = player.img;
        }

        function nextPlayer() {
            currentIndex = (currentIndex + 1) % players.length;
            updatePlayer();
        }

        function prevPlayer() {
            currentIndex = (currentIndex - 1 + players.length) % players.length;
            updatePlayer();
        }

        updatePlayer();

        const tournaments = [
            {
                name: "Master de Madrid",
                url: "https://www.premierpadel.com/es/tournaments-upcoming/madrid-p1",
                img: "https://www.madridpremierpadel.com/wp-content/uploads/2025/02/2-7-SEPT.-2025-MOVISTAR-ARENA-1-thegem-blog-justified.png"
            },
            {
                name: "Open de Barcelona",
                url: "https://www.premierpadel.com/es/tournaments-upcoming/barcelona-finals",
                img: "https://assets.weebora.com/images/small_premier_padel_final_barcelona_palau_san_jordi_2025_webora_74fb994365.jpg"
            },
            {
                name: "Finals de Málaga",
                url: "https://www.premierpadel.com/es/tournaments-upcoming/malaga-p1",
                img: "https://malagapremierpadel.com/wp-content/uploads/2025/03/Poster-Malaga-2025-Horizontal-thegem-blog-justified.jpg"
            }
        ];

        const tournamentList = document.getElementById("tournament-list");
        tournaments.forEach(t => {
            const div = document.createElement("div");
            div.className = "tournament";

            const img = document.createElement("img");
            img.src = t.img;
            img.alt = t.name;

            const link = document.createElement("a");
            link.href = t.url;
            link.target = "_blank";
            link.innerText = t.name + " - Entradas";

            div.appendChild(img);
            div.appendChild(link);
            tournamentList.appendChild(div);
        });

        function recommendPaddle() {
            const style = document.getElementById("style-select").value;
            const recommendationDiv = document.getElementById("paddle-recommendation");
            recommendationDiv.innerHTML = "";

            let paddles = [];

            if (style === "control") {
                paddles = [
                    { name: "Nox Control Pro", url: "https://noxsport.com/products/pala-at10-genius-18k-alum-by-agustin-tapia?srsltid=AfmBOorZlIJQRzlJi98m8jGhJKZaMW9jmtSybIbhDQGpDWpn2ero7DSj", img: "https://noxsport.com/cdn/shop/files/at10-luxury-genius-18k-alum-2025-by-agustin-tapia-pat10genius1825-8436603199919-627573.jpg?v=1727176170" },
                    { name: "Bullpadel Vertex CTR", url: "https://www.bullpadel.com/es/pro-line/4547-pala-bullpadel-vertex-04-25.html", img: "https://www.zonadepadel.es/20443-zdp_customer/bullpadel-vertex-04-2025.jpg" }
                ];
            } else if (style === "potencia") {
                paddles = [
                    { name: "Bullpadel Hack 03", url: "https://www.bullpadel.com/es/premier-padel/4661-pala-bullpadel-hack-04-premier.html", img: "https://www.zonadepadel.es/23188-medium_default/bullpadel-hack-04-premier-2025.jpg" },
                    { name: "Adidas Metalbone 3.2", url: "https://www.adidas.es/pala-de-padel-metalbone-hrd_-3.4/JK5293.html?gQT=2", img: "https://www.zonadepadel.es/21735-large_default/adidas-metalbone-hard-34-2025.jpg" }
                ];
            } else {
                paddles = [
                    { name: "Adidas Adipower Multiweight", url: "https://www.adidas.es/pala-de-padel-adipower-multiweight-3.3/IV0971.html", img: "https://www.tiendapadelpoint.com/image/cache/data/pala-adidas-alex-ruiz-adipower-multiweight-control-3-4-2025-1-1100x1100.jpg" },
                    { name: "Head Gravity Pro", url: "https://www.head.com/es_ES/gravity-pro-2024-224004.html", img: "https://www.zonadepadel.es/20309-zdp_customer/head-gravity-pro-2025.jpg" }
                ];
            }

            paddles.forEach(p => {
                const div = document.createElement("div");
                div.className = "paddle";

                const img = document.createElement("img");
                img.src = p.img;
                img.alt = p.name;

                const link = document.createElement("a");
                link.href = p.url;
                link.target = "_blank";
                link.innerText = p.name;

                div.appendChild(img);
                div.appendChild(link);
                recommendationDiv.appendChild(div);
            });
        }

        recommendPaddle(); 
    </script>
</body>
</html>
